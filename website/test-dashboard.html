<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Test</title>
</head>
<body>
    <h1>Testing Dashboard Loading</h1>
    
    <div>Active Users: <span id="active-users">Loading...</span></div>
    <div>Last Analysis: <span id="last-analysis">Loading...</span></div>
    <div>Analysis Count: <span id="analysis-count">Loading...</span></div>
    
    <button onclick="testRefreshData()">Test Refresh</button>
    <button onclick="testUpdateDashboard()">Test Update</button>

    <script>
        console.log('Test script loaded');

        async function testRefreshData() {
            console.log('testRefreshData called');
            try {
                console.log('Fetching /api/economy/status...');
                const response = await fetch('/api/economy/status');
                console.log('Response received:', response);
                const data = await response.json();
                console.log('Data parsed:', data);
                updateDashboard(data);
            } catch (error) {
                console.error('Failed to refresh data:', error);
            }
        }

        function updateDashboard(data) {
            console.log('updateDashboard called with data:', data);
            try {
                if (data.success && data.data) {
                    console.log('Data validation passed, updating dashboard elements...');
                    
                    // Update active users
                    if (data.data.kpis) {
                        console.log('KPIs data found:', data.data.kpis);
                        try {
                            const users = parseInt(data.data.kpis.activeUsers) || 0;
                            const activeUsersElement = document.getElementById('active-users');
                            console.log('active-users element:', activeUsersElement);
                            if (activeUsersElement) {
                                activeUsersElement.textContent = users.toLocaleString();
                                console.log('Active users updated:', users);
                            } else {
                                console.error('active-users element not found!');
                            }
                        } catch (e) { 
                            console.error('Active users update error:', e); 
                        }
                    }
                    
                    // Update recent actions
                    console.log('Processing recent actions:', data.data.recentActions);
                    if (data.data.recentActions && data.data.recentActions.length > 0) {
                        const lastAction = data.data.recentActions[0];
                        console.log('Last action:', lastAction);
                        const lastActionTime = new Date(lastAction.timestamp);
                        const now = new Date();
                        const diffMinutes = Math.floor((now - lastActionTime) / (1000 * 60));
                        console.log('Time diff in minutes:', diffMinutes);
                        
                        let timeText;
                        if (diffMinutes < 60) {
                            timeText = diffMinutes + ' min ago';
                        } else if (diffMinutes < 1440) {
                            timeText = Math.floor(diffMinutes / 60) + ' hr ago';
                        } else {
                            timeText = Math.floor(diffMinutes / 1440) + ' days ago';
                        }
                        
                        const lastAnalysisElement = document.getElementById('last-analysis');
                        console.log('last-analysis element:', lastAnalysisElement);
                        if (lastAnalysisElement) {
                            lastAnalysisElement.textContent = timeText;
                            console.log('last-analysis updated to:', timeText);
                        } else {
                            console.error('last-analysis element not found!');
                        }
                    } else {
                        const lastAnalysisElement = document.getElementById('last-analysis');
                        if (lastAnalysisElement) {
                            lastAnalysisElement.textContent = 'No recent activity';
                            console.log('last-analysis set to: No recent activity');
                        }
                    }
                    
                    // Update analysis count
                    const analysisCountText = (data.data.recentActions?.length * 10 || 0) + '+';
                    const analysisCountElement = document.getElementById('analysis-count');
                    console.log('analysis-count element:', analysisCountElement);
                    if (analysisCountElement) {
                        analysisCountElement.textContent = analysisCountText;
                        console.log('analysis-count updated to:', analysisCountText);
                    } else {
                        console.error('analysis-count element not found!');
                    }
                } else {
                    console.error('Invalid data structure received:', data);
                }
            } catch (error) {
                console.error('updateDashboard error:', error);
            }
        }

        function testUpdateDashboard() {
            // Test with mock data
            const mockData = {
                success: true,
                data: {
                    kpis: {
                        activeUsers: 5
                    },
                    recentActions: [
                        {
                            timestamp: "2025-09-12T20:00:00.000Z",
                            action: "test_action"
                        }
                    ]
                }
            };
            console.log('Testing with mock data:', mockData);
            updateDashboard(mockData);
        }

        // Auto-run on load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, auto-running test');
            testRefreshData();
        });
    </script>
</body>
</html>
