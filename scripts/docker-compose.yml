# ATIVE Casino Bot - Docker Compose Configuration
# Complete stack with bot, database, and monitoring

version: '3.8'

services:
  # ATIVE Casino Bot
  casino-bot:
    build: .
    container_name: ative-casino-bot
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      - NODE_ENV=production
      - ENVIRONMENT=production
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - MARIADB_HOST=mariadb
      - MARIADB_PORT=3306
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - DEVELOPER_ID=${DEVELOPER_ID}
      - LOG_CHANNEL_ID=${LOG_CHANNEL_ID}
      - ENABLE_HEALTH_CHECKS=true
      - PORT=3000
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./temp:/app/temp
    networks:
      - casino-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MariaDB Database
  mariadb:
    image: mariadb:10.11
    container_name: ative-casino-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MARIADB_DATABASE}
      - MYSQL_USER=${MARIADB_USER}
      - MYSQL_PASSWORD=${MARIADB_PASSWORD}
      - MYSQL_CHARACTER_SET_SERVER=utf8mb4
      - MYSQL_COLLATION_SERVER=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - casino-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MARIADB_ROOT_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Adminer - Database Management Interface (Optional)
  adminer:
    image: adminer:latest
    container_name: ative-casino-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - casino-network
    depends_on:
      - mariadb

volumes:
  mariadb-data:
    driver: local

networks:
  casino-network:
    driver: bridge

# Development override
# Use: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
---
# docker-compose.dev.yml (for development)
version: '3.8'

services:
  casino-bot:
    build:
      target: development
    environment:
      - NODE_ENV=development
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
      - "9229:9229"  # Node.js debugging port
    command: ["npm", "run", "dev"]